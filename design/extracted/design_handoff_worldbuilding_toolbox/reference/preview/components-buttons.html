<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .label {
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--steel-300); font-weight: 500;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    font-family: var(--font-mono); font-size: 12px; font-weight: 500;
    padding: 9px 16px; border-radius: var(--radius-md);
    border: 1px solid transparent; cursor: pointer; line-height: 1;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn.primary { background: var(--cyan); color: var(--space-950); }
  .btn.primary:hover { background: var(--cyan-dim); }
  .btn.secondary { background: var(--bg-elevated); color: var(--fg); border-color: var(--border-strong); }
  .btn.ghost { background: transparent; color: var(--fg); }
  .btn.ghost:hover { background: var(--bg-hover); }
  .btn.danger { background: transparent; color: var(--red-hud); border-color: var(--red-hud); }
  .btn.outline { background: transparent; color: var(--cyan); border-color: var(--cyan); }
  .btn.focused { box-shadow: 0 0 0 2px var(--space-900), 0 0 0 4px var(--cyan); }
  .btn.sm { font-size: 11px; padding: 6px 12px; }
  .btn svg { display: inline-block; }
</style>
</head>
<body>
  <div class="label">Default</div>
  <div class="row">
    <button class="btn primary">New entry</button>
    <button class="btn secondary">Cancel</button>
    <button class="btn ghost">Skip</button>
    <button class="btn outline">View raw</button>
    <button class="btn danger">Purge</button>
  </div>
  <div class="label">Small</div>
  <div class="row">
    <button class="btn primary sm">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Capture
    </button>
    <button class="btn secondary sm">Discard</button>
    <button class="btn ghost sm">Reset</button>
    <button class="btn primary sm focused">Focused</button>
  </div>
</body>
</html>
