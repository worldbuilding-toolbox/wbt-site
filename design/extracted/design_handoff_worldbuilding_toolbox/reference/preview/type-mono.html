<!DOCTYPE html>
<html data-theme="constellation">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 32px; align-items: baseline; }
  .label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--cyan); font-weight: 500; margin-bottom: 4px; }
  .hud { font-family: var(--font-mono); font-size: 13px; color: var(--fg); }
  .hud-strong { font-family: var(--font-mono); font-size: 14px; color: var(--fg); font-weight: 500; }
  .hud-dim { font-family: var(--font-mono); font-size: 12px; color: var(--steel-300); }
  .row-meta { display: flex; gap: 20px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="label">HUD Label · 11</div>
      <div class="hud" style="font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--cyan);">SECTOR 04 · ACTIVE</div>
    </div>
    <div>
      <div class="label">Annotation · 13</div>
      <div class="hud">ID-0042 · classified</div>
    </div>
    <div>
      <div class="label">Metric · 14 · 500</div>
      <div class="hud-strong">4192.06.12</div>
    </div>
    <div>
      <div class="label">Caption · 12</div>
      <div class="hud-dim">12 of 47 events visible</div>
    </div>
  </div>
  <div class="row-meta">
    <span class="token">--font-mono</span>
    <span class="token">JetBrains Mono</span>
    <span class="token">tracking 0.16em on labels</span>
  </div>
</body>
</html>
