<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px 32px; background-image: var(--grain); }
  .body {
    font-family: var(--font-sans); font-size: 17px;
    line-height: 1.65; color: var(--fg); max-width: 58ch; font-weight: 400;
  }
  .lede {
    font-family: var(--font-sans); font-size: 20px;
    line-height: 1.5; color: var(--steel-300);
    max-width: 58ch; font-weight: 300;
  }
  .row-meta {
    display: flex; gap: 20px; margin-top: 16px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--steel-400); text-transform: uppercase; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <p class="lede">A jump-route survey from Veris-3 to the outer rim, conducted in standard year 4192.</p>
  <p class="body" style="margin-top: 10px;">Twelve waypoints, three contested. The crew of the <em>Aetherline</em> kept a parallel log on physical paper, which is why we have any record of the third sector at all.</p>
  <div class="row-meta">
    <span>17px / 1.65</span><span>--font-body</span><span>measure 58ch</span>
  </div>
</body>
</html>
