<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .label {
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--steel-300); font-weight: 500;
  }
  .empty {
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
    padding: 24px 18px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    height: 100%;
  }
  .empty .ill { color: var(--steel-300); }
  .empty h5 {
    font-family: var(--font-sans); font-size: 16px; font-weight: 500;
    margin: 0; color: var(--fg);
  }
  .empty p {
    font-family: var(--font-sans); font-size: 13px; color: var(--steel-300);
    margin: 0; max-width: 26ch; line-height: 1.5;
  }
  .pane { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
  <div class="pane">
    <span class="label">No entries</span>
    <div class="empty">
      <svg class="ill" viewBox="0 0 240 100" width="200" height="80" fill="none">
        <g stroke="currentColor" stroke-width="0.8" stroke-opacity="0.5">
          <line x1="60" y1="30" x2="110" y2="60"/><line x1="110" y1="60" x2="150" y2="35"/><line x1="150" y1="35" x2="180" y2="75"/>
        </g>
        <g fill="currentColor">
          <circle cx="60" cy="30" r="2"/><circle cx="110" cy="60" r="2.5" fill="#7fdbff"/><circle cx="150" cy="35" r="2"/><circle cx="180" cy="75" r="2"/>
        </g>
      </svg>
      <h5>Sector uncharted</h5>
      <p>Drop a waypoint to begin survey.</p>
    </div>
  </div>
  <div class="pane">
    <span class="label">No ideas</span>
    <div class="empty">
      <svg class="ill" viewBox="0 0 240 100" width="200" height="80" fill="none">
        <line x1="20" y1="60" x2="220" y2="60" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round"/>
        <g stroke="currentColor" stroke-opacity="0.5" fill="none">
          <circle cx="20" cy="60" r="3"/><circle cx="220" cy="60" r="3"/>
        </g>
        <g fill="currentColor" opacity="0.5">
          <circle cx="20" cy="60" r="1.4"/><circle cx="220" cy="60" r="1.4"/>
        </g>
        <rect x="100" y="30" width="40" height="22" rx="2" stroke="#7fdbff" stroke-opacity="0.5" stroke-dasharray="2 3"/>
      </svg>
      <h5>Inbox empty</h5>
      <p>Capture an idea — it'll wait here.</p>
    </div>
  </div>
</body>
</html>
