<!DOCTYPE html>
<html data-theme="constellation">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; }
  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 100%; aspect-ratio: 1.2/1; border-radius: 2px; border: 1px solid var(--space-700); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#060810"></div><div class="name">space-950</div><div class="hex">#060810</div></div>
    <div class="sw"><div class="chip" style="background:#0b0e14"></div><div class="name">space-900</div><div class="hex">#0b0e14</div></div>
    <div class="sw"><div class="chip" style="background:#11151d"></div><div class="name">space-850</div><div class="hex">#11151d</div></div>
    <div class="sw"><div class="chip" style="background:#161b25"></div><div class="name">space-800</div><div class="hex">#161b25</div></div>
    <div class="sw"><div class="chip" style="background:#1f2532"></div><div class="name">space-700</div><div class="hex">#1f2532</div></div>
    <div class="sw"><div class="chip" style="background:#2a3447"></div><div class="name">space-600</div><div class="hex">#2a3447</div></div>
    <div class="sw"><div class="chip" style="background:#3d485e"></div><div class="name">space-500</div><div class="hex">#3d485e</div></div>
    <div class="sw"><div class="chip" style="background:#5a6275"></div><div class="name">steel-400</div><div class="hex">#5a6275</div></div>
    <div class="sw"><div class="chip" style="background:#8a91a3"></div><div class="name">steel-300</div><div class="hex">#8a91a3</div></div>
    <div class="sw"><div class="chip" style="background:#c6c9d2"></div><div class="name">bone-200</div><div class="hex">#c6c9d2</div></div>
    <div class="sw"><div class="chip" style="background:#e6e7eb"></div><div class="name">bone-100</div><div class="hex">#e6e7eb</div></div>
    <div class="sw"><div class="chip" style="background:#f5f5f8"></div><div class="name">bone-50</div><div class="hex">#f5f5f8</div></div>
  </div>
</body>
</html>
