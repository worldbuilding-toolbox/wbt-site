<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; height: 100%; min-height: 220px; position: relative; overflow: hidden; background: var(--bg); }
  body::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background-image: var(--grain);
    z-index: 3;
  }
  .label {
    position: absolute; top: 16px; left: 18px;
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--steel-300); font-weight: 500; z-index: 4;
  }
  .sky { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Each constellation (lines + dots) drifts as a single group, so endpoints
     and dots never separate. transform-box ensures the rotation/translation
     pivots in local coordinates. */
  .ctn { transform-box: fill-box; transform-origin: center; }
  .ctn.c1 { animation: drift-1 36s ease-in-out infinite; }
  .ctn.c2 { animation: drift-2 48s ease-in-out infinite; }
  .ctn.c3 { animation: drift-3 42s ease-in-out infinite; }
  .ctn.c4 { animation: drift-4 54s ease-in-out infinite; }

  @keyframes drift-1 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(6px, -4px); }
  }
  @keyframes drift-2 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-5px, 3px); }
  }
  @keyframes drift-3 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(4px, 4px); }
  }
  @keyframes drift-4 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-4px, -3px); }
  }

  /* Twinkle on dots (opacity only — never moves the dot off its line endpoint) */
  .tw { animation: tw 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .tw.t1 { animation-duration: 4.5s; animation-delay: 0s; }
  .tw.t2 { animation-duration: 5.8s; animation-delay: 1.1s; }
  .tw.t3 { animation-duration: 3.4s; animation-delay: 2.3s; }
  .tw.t4 { animation-duration: 6.6s; animation-delay: 3.6s; }
  .tw.t5 { animation-duration: 5.2s; animation-delay: 0.6s; }
  @keyframes tw {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.45; }
  }

  /* Cyan anchor stars pulse harder + glow */
  .anchor { animation: anchor 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .anchor.a1 { animation-delay: 0.2s; }
  .anchor.a2 { animation-delay: 2.8s; }
  .anchor.a3 { animation-delay: 4.4s; }
  @keyframes anchor {
    0%, 100% { opacity: 1;    filter: drop-shadow(0 0 0px #7fdbff); }
    50%      { opacity: 0.85; filter: drop-shadow(0 0 5px #7fdbff); }
  }

  /* Lines slowly breathe */
  .line-fade { animation: lf 9s ease-in-out infinite; }
  .line-fade.lf1 { animation-delay: 0s; }
  .line-fade.lf2 { animation-delay: 3s; }
  .line-fade.lf3 { animation-delay: 6s; }
  @keyframes lf {
    0%, 100% { stroke-opacity: 0.28; }
    50%      { stroke-opacity: 0.12; }
  }

  /* Solo stars — scattered faint dots, twinkling out of phase */
  .faint { animation: faint 8s ease-in-out infinite; }
  .faint.f1 { animation-delay: 0s; }
  .faint.f2 { animation-delay: 2s; }
  .faint.f3 { animation-delay: 4s; }
  .faint.f4 { animation-delay: 6s; }
  @keyframes faint {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.15; }
  }
</style>
</head>
<body>
  <span class="label">Constellation backdrop · star linework</span>

  <svg class="sky" viewBox="0 0 800 220" preserveAspectRatio="xMidYMid slice" fill="none">
    <!-- Constellation 1 — top-left "Y" -->
    <g class="ctn c1">
      <g stroke="#e6e7eb" stroke-width="0.5">
        <line class="line-fade lf1" x1="80" y1="50" x2="180" y2="110" />
        <line class="line-fade lf1" x1="180" y1="110" x2="280" y2="60" />
        <line class="line-fade lf2" x1="180" y1="110" x2="200" y2="180" />
      </g>
      <g fill="#e6e7eb">
        <circle class="tw t1" cx="80"  cy="50"  r="1.6" />
        <circle class="anchor a1" cx="180" cy="110" r="2.6" fill="#7fdbff" />
        <circle class="tw t2" cx="280" cy="60"  r="1.6" />
        <circle class="tw t3" cx="200" cy="180" r="1.4" />
      </g>
    </g>

    <!-- Constellation 2 — middle zigzag -->
    <g class="ctn c2">
      <g stroke="#e6e7eb" stroke-width="0.5">
        <line class="line-fade lf2" x1="320" y1="130" x2="400" y2="90" />
        <line class="line-fade lf2" x1="400" y1="90"  x2="470" y2="140" />
        <line class="line-fade lf3" x1="470" y1="140" x2="540" y2="100" />
      </g>
      <g fill="#e6e7eb">
        <circle class="tw t4" cx="320" cy="130" r="1.6" />
        <circle class="anchor a2" cx="400" cy="90"  r="2.6" fill="#7fdbff" />
        <circle class="tw t5" cx="470" cy="140" r="1.4" />
        <circle class="tw t1" cx="540" cy="100" r="1.6" />
      </g>
    </g>

    <!-- Constellation 3 — top-right "L" -->
    <g class="ctn c3">
      <g stroke="#e6e7eb" stroke-width="0.5">
        <line class="line-fade lf3" x1="600" y1="50"  x2="680" y2="110" />
        <line class="line-fade lf3" x1="680" y1="110" x2="740" y2="80" />
      </g>
      <g fill="#e6e7eb">
        <circle class="tw t2" cx="600" cy="50"  r="1.6" />
        <circle class="anchor a3" cx="680" cy="110" r="2.6" fill="#7fdbff" />
        <circle class="tw t3" cx="740" cy="80"  r="1.4" />
      </g>
    </g>

    <!-- Constellation 4 — bottom triangle -->
    <g class="ctn c4">
      <g stroke="#e6e7eb" stroke-width="0.5">
        <line class="line-fade lf1" x1="120" y1="170" x2="240" y2="190" />
        <line class="line-fade lf1" x1="380" y1="180" x2="500" y2="160" />
        <line class="line-fade lf2" x1="500" y1="160" x2="640" y2="200" />
      </g>
      <g fill="#e6e7eb">
        <circle class="tw t4" cx="120" cy="170" r="1.4" />
        <circle class="tw t5" cx="240" cy="190" r="1.6" />
        <circle class="tw t1" cx="380" cy="180" r="1.4" />
        <circle class="tw t2" cx="500" cy="160" r="1.6" />
        <circle class="tw t3" cx="640" cy="200" r="1.4" />
      </g>
    </g>

    <!-- Solo scatter — no lines to worry about -->
    <g fill="#e6e7eb">
      <circle class="faint f1" cx="60"  cy="120" r="0.7" />
      <circle class="faint f2" cx="350" cy="40"  r="0.7" />
      <circle class="faint f3" cx="560" cy="50"  r="0.7" />
      <circle class="faint f4" cx="780" cy="40"  r="0.7" />
      <circle class="faint f1" cx="40"  cy="200" r="0.7" />
      <circle class="faint f2" cx="300" cy="200" r="0.7" />
      <circle class="faint f3" cx="700" cy="200" r="0.7" />
      <circle class="faint f4" cx="780" cy="160" r="0.7" />
      <circle class="faint f2" cx="240" cy="90"  r="0.7" />
    </g>
  </svg>
</body>
</html>
