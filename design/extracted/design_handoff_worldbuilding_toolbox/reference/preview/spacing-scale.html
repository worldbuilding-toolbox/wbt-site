<!DOCTYPE html>
<html data-theme="manuscript">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px 32px; }
  .scale { display: flex; align-items: flex-end; gap: 18px; }
  .step { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .bar { background: var(--ink-900); border-radius: 2px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="scale">
    <div class="step"><div class="bar" style="width:16px; height:4px;"></div><div class="px">4</div><div class="tok">--space-1</div></div>
    <div class="step"><div class="bar" style="width:16px; height:8px;"></div><div class="px">8</div><div class="tok">--space-2</div></div>
    <div class="step"><div class="bar" style="width:16px; height:12px;"></div><div class="px">12</div><div class="tok">--space-3</div></div>
    <div class="step"><div class="bar" style="width:16px; height:16px;"></div><div class="px">16</div><div class="tok">--space-4</div></div>
    <div class="step"><div class="bar" style="width:16px; height:20px;"></div><div class="px">20</div><div class="tok">--space-5</div></div>
    <div class="step"><div class="bar" style="width:16px; height:24px;"></div><div class="px">24</div><div class="tok">--space-6</div></div>
    <div class="step"><div class="bar" style="width:16px; height:32px;"></div><div class="px">32</div><div class="tok">--space-8</div></div>
    <div class="step"><div class="bar" style="width:16px; height:40px;"></div><div class="px">40</div><div class="tok">--space-10</div></div>
    <div class="step"><div class="bar" style="width:16px; height:48px;"></div><div class="px">48</div><div class="tok">--space-12</div></div>
    <div class="step"><div class="bar" style="width:16px; height:64px;"></div><div class="px">64</div><div class="tok">--space-16</div></div>
    <div class="step"><div class="bar" style="width:16px; height:80px;"></div><div class="px">80</div><div class="tok">--space-20</div></div>
    <div class="step"><div class="bar" style="width:16px; height:96px;"></div><div class="px">96</div><div class="tok">--space-24</div></div>
  </div>
</body>
</html>
