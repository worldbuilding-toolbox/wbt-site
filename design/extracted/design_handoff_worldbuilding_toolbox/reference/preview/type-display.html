<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px 32px; }
  .display {
    font-family: var(--font-sans); font-size: 64px;
    line-height: 1.02; letter-spacing: -0.03em; font-weight: 500;
    color: var(--fg);
  }
  .h1 {
    font-family: var(--font-sans); font-size: 44px;
    line-height: 1.1; letter-spacing: -0.02em; font-weight: 500;
    color: var(--fg); margin-top: 8px;
  }
  .h3 {
    font-family: var(--font-sans); font-size: 22px;
    line-height: 1.2; font-weight: 400; color: var(--steel-300); margin-top: 6px;
  }
  .row-meta {
    display: flex; gap: 20px; margin-top: 18px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--steel-400); text-transform: uppercase; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="display">Chart the void.</div>
  <div class="h1">Sector 04 — survey log.</div>
  <div class="h3">Space Grotesk · display + body</div>
  <div class="row-meta">
    <span>--font-display</span><span>--font-body</span><span>wght 300..700</span>
  </div>
</body>
</html>
