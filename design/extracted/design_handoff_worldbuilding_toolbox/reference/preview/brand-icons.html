<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 18px 12px;
  }
  .icon-cell {
    display: flex; flex-direction: column;
    align-items: center; gap: 7px;
    color: var(--fg);
  }
  .icon-cell svg { color: var(--fg); }
  .icon-cell.accent svg { color: var(--cyan); }
  .name {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--steel-300);
    text-align: center;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const ICONS = {
      // Worldbuilding core
      timeline: '<path d="M4 16l6 -7l5 5l5 -6"/><circle cx="4" cy="16" r="1"/><circle cx="10" cy="9" r="1"/><circle cx="15" cy="14" r="1"/><circle cx="20" cy="8" r="1"/>',
      map: '<path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3z"/><path d="M9 4v13"/><path d="M15 7v13"/>',
      compass: '<path d="M8 16l2.5 -6.5l6.5 -2.5l-2.5 6.5z"/><circle cx="12" cy="12" r="9"/>',
      planet: '<circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="3" transform="rotate(-22 12 12)"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18"/><path d="M12.5 3a17 17 0 0 1 0 18"/>',
      star: '<path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z"/>',
      "moon-stars": '<path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/><path d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0 -2 2a2 2 0 0 0 -2 -2a2 2 0 0 0 2 -2"/><path d="M19 11h1m-.5 -.5v1"/>',
      // Sci-fi (accented in cyan)
      rocket: '<path d="M4 13a8 8 0 0 1 7 7a6 6 0 0 0 3 -5a9 9 0 0 0 6 -8a3 3 0 0 0 -3 -3a9 9 0 0 0 -8 6a6 6 0 0 0 -5 3"/><path d="M7 14a6 6 0 0 0 -3 6a6 6 0 0 0 6 -3"/><circle cx="15" cy="9" r="1"/>',
      target: '<circle cx="12" cy="12" r="1"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9"/>',
      "chart-arcs": '<circle cx="12" cy="12" r="1"/><path d="M16.924 11.132a5 5 0 1 0 -4.056 5.792"/><path d="M3.1 10.5a9 9 0 1 0 11.3 -6.4"/>',
      radioactive: '<path d="M13.5 14.6l3 5.19a9 9 0 0 0 4.5 -7.79h-6a3 3 0 0 1 -1.5 2.6z"/><path d="M13.5 9.4l3 -5.19a9 9 0 0 0 -9 0l3 5.19a3 3 0 0 1 3 0z"/><path d="M10.5 14.6l-3 5.19a9 9 0 0 1 -4.5 -7.79h6a3 3 0 0 0 1.5 2.6z"/><circle cx="12" cy="12" r="1"/>',
      galaxy: '<circle cx="12" cy="12" r="3"/><path d="M20.985 12.518a9 9 0 1 0 -8.45 8.466"/><path d="M14.5 19c-1 -3 -1.5 -5.5 -.5 -7s4 -1 5.5 -3"/>',
      signal: '<path d="M3 12h.01"/><path d="M7 12c0 -1.66 .67 -3.16 1.76 -4.24"/><path d="M17 12c0 1.66 -.67 3.16 -1.76 4.24"/><path d="M11 12a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M21 12h-.01"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
      database: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6a8 3 0 0 0 16 0v-6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/>',
      // History / lore
      book: '<path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6l0 13"/><path d="M12 6l0 13"/><path d="M21 6l0 13"/>',
      scroll: '<path d="M19 17v2a2 2 0 0 1 -2 2h-11a3 3 0 0 1 -3 -3v-1h10v2a2 2 0 1 0 4 0v-14a2 2 0 1 1 2 2h-2m2 -4h-11a3 3 0 0 0 -3 3v11"/>',
      faction: '<path d="M12 3l8 3v6c0 4.5 -3.5 8 -8 9c-4.5 -1 -8 -4.5 -8 -9v-6z"/><path d="M8 12l4 -3l4 3"/>',
      // UI primitives
      plus: '<path d="M12 5l0 14"/><path d="M5 12l14 0"/>',
      search: '<circle cx="10" cy="10" r="7"/><path d="M21 21l-6 -6"/>',
      pencil: '<path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/>',
      paperclip: '<path d="M15 7l-6.5 6.5a1.5 1.5 0 0 0 3 3l6.5 -6.5a3 3 0 0 0 -6 -6l-6.5 6.5a4.5 4.5 0 0 0 9 9l6.5 -6.5"/>',
      link: '<path d="M9 15l6 -6"/><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464"/><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463"/>',
      photo: '<path d="M15 8h.01"/><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 15l4 -4a3 5 0 0 1 3 0l5 5"/><path d="M14 14l1 -1a3 5 0 0 1 3 0l2 2"/>',
      calendar: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/>',
      "layout-grid": '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
      settings: '<path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><circle cx="12" cy="12" r="3"/>',
      user: '<circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>',
    };
    // Larger alien glyph — shown bigger
    const ALIEN = '<path d="M12 3c-4.5 0 -7 3.6 -7 8.5c0 4.2 2.6 8.5 7 8.5s7 -4.3 7 -8.5c0 -4.9 -2.5 -8.5 -7 -8.5z"/><ellipse cx="9" cy="12" rx="1.4" ry="2.4" transform="rotate(-18 9 12)" fill="currentColor" stroke="none"/><ellipse cx="15" cy="12" rx="1.4" ry="2.4" transform="rotate(18 15 12)" fill="currentColor" stroke="none"/>';
    // Accent set: which icons should pick up cyan to read as "HUD" highlights
    const accent = new Set(["rocket","radioactive","alien","galaxy","signal","target","chart-arcs","faction"]);
    const grid = document.getElementById('grid');
    Object.entries(ICONS).forEach(([name, paths]) => {
      const el = document.createElement('div');
      el.className = 'icon-cell' + (accent.has(name) ? ' accent' : '');
      el.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg><span class="name">${name}</span>`;
      grid.appendChild(el);
    });
    // Alien — bigger to show simplified glyph clearly
    const alienEl = document.createElement('div');
    alienEl.className = 'icon-cell accent';
    alienEl.innerHTML = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="margin-top:-6px; margin-bottom:-6px;">${ALIEN}</svg><span class="name">alien</span>`;
    grid.appendChild(alienEl);
  </script>
</body>
</html>
